[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statement-parser"
version = "0.1.0"
description = "Credit card statement parser backend for the Rupiverse mobile app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "httpx",
    "docling",
    "pdfplumber",
    "pikepdf",
    "psycopg[binary,pool]>=3.3.6",
]

[project.scripts]
statement-parser = "statement_parser.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/statement_parser"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
