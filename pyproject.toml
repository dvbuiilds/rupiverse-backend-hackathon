[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statement-parser"
version = "0.1.0"
description = "Credit card statement parser backend for the Rupiverse mobile app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic-settings",
    "httpx",
    "docling",
    "pdfplumber",
    "pikepdf",
]

[tool.hatch.build.targets.wheel]
packages = ["src/statement_parser"]
